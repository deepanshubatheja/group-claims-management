[project]
name = "group-claims-backend"
version = "0.1.0"
description = "Local application core for Group Claims Management."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "PyMuPDF>=1.26.7,<2",
  "Pillow>=11.3.0,<12",
  "pypdf>=5.9.0,<6",
  "pytesseract>=0.3.13,<1",
  "xlrd>=2.0.1,<3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
